<div class="app-shell" *ngIf="auth.isLoggedIn(); else loginBlock">
  <aside class="sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-brand">
      
      <span class="brand-text" *ngIf="!sidebarCollapsed">ServisPro</span>
    </div>
    <nav class="sidebar-nav">
      <a *ngFor="let item of navItems"
         [routerLink]="item.path"
         routerLinkActive="active"
         class="nav-item">
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label" *ngIf="!sidebarCollapsed">{{ item.label }}</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info" *ngIf="!sidebarCollapsed">
        <div class="user-name">{{ auth.currentUser?.naziv_firme }}</div>
        <div class="user-role">{{ auth.currentUser?.uloga }}</div>
      </div>
      <button class="btn-logout" (click)="logout()">
        <span>🚪</span>
        <span *ngIf="!sidebarCollapsed">Odjavi se</span>
      </button>
    </div>
  </aside>
  <main class="main-content">
    <header class="topbar">
      <button class="toggle-btn" (click)="sidebarCollapsed = !sidebarCollapsed">☰</button>
      <div class="topbar-right">
        <span class="user-email">{{ auth.currentUser?.email }}</span>
      </div>
    </header>
    <div class="page-content"><router-outlet /></div>
  </main>
</div>
<ng-template #loginBlock><app-login /></ng-template>
