<div class="page-header">
  <h2>Obaveštenja</h2>
  <button class="btn btn-outline" (click)="markAllRead()">Označi sve kao pročitano</button>
</div>
<div class="notif-list">
  <div *ngFor="let o of obavestenja" class="notif-item" [class.unread]="!o.procitano" (click)="markRead(o)">
    <div class="notif-dot" *ngIf="!o.procitano"></div>
    <div class="notif-body">
      <div class="notif-text">{{ o.sadrzaj }}</div>
      <div class="notif-meta">
        <span>{{ o.user_naziv }}</span>
        <span>{{ formatTime(o.vreme_slanja) }}</span>
      </div>
    </div>
  </div>
  <div *ngIf="obavestenja.length === 0" class="empty-state">Nemate obaveštenja.</div>
</div>
